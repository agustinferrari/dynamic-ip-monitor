name: Build and package

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Compile
        shell: pwsh
        run: ./scripts/build.ps1
      - name: Test without network
        shell: pwsh
        run: ./scripts/test.ps1
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1
      - uses: actions/upload-artifact@v7
        with:
          name: DynamicIPMonitor-windows
          path: dist/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: DynamicIPMonitor-windows
          path: dist
      - name: Create draft release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_REPO: ${{ github.repository }}
        run: |
          $assets = Get-ChildItem -LiteralPath dist -File | ForEach-Object { $_.FullName }
          gh release create $env:RELEASE_TAG @assets --repo $env:RELEASE_REPO --verify-tag --draft --prerelease --title "Dynamic IP Monitor $env:RELEASE_TAG" --generate-notes
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed.' }
